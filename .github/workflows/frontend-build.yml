name: Frontend build

on:
  push:
    branches:
      - feature/oriva-animated-frontend
      - feat/oriva-live-data-quality-frontend
      - feat/oriva-current-data-dashboard
    paths:
      - "frontend/**"
      - "backend/services/openaq_service.py"
      - "backend/services/openweather_service.py"
      - "backend/api/routes/live_environment.py"
      - "backend/tests/test_openaq_service.py"
      - "backend/tests/test_openweather_service.py"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "backend/services/openaq_service.py"
      - "backend/services/openweather_service.py"
      - "backend/api/routes/live_environment.py"
      - "backend/tests/test_openaq_service.py"
      - "backend/tests/test_openweather_service.py"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  backend-openaq-tests:
    name: OpenAQ freshness unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Test OpenAQ freshness classification
        run: python -m pytest -q backend/tests/test_openaq_service.py

  backend-openweather-tests:
    name: OpenWeather current data unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install pytest requests
      - name: Test OpenWeather parsing and freshness
        run: python -m pytest -q backend/tests/test_openweather_service.py
