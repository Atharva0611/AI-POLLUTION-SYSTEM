name: Frontend build

on:
  push:
    branches:
      - feature/oriva-animated-frontend
      - feat/oriva-live-data-quality-frontend
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-build.yml"

jobs:
  build:
    name: Vite production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
